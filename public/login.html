<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elverket Rum · logga in</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0d0f;--ink:#f1ede6;--mute:#a19d96;--line:rgba(255,255,255,.14);--acc:#ffc77a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 110%,#2a1d10 0%,var(--bg) 60%);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;padding:24px}
.room{width:min(380px,100%)}
.box{aspect-ratio:34/11.32;border:1px solid var(--line);border-radius:6px;position:relative;margin-bottom:28px;background:linear-gradient(90deg,rgba(255,199,122,.0),rgba(255,199,122,.12),rgba(255,199,122,0))}
.box::after{content:"34 × 11,32 × 8 m";position:absolute;right:10px;bottom:6px;font-size:12px;color:var(--mute)}
h1{margin:0 0 4px;font-size:34px;line-height:1.05}
p{color:var(--mute);margin:0 0 22px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
input{width:100%;font:16px Archivo,sans-serif;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
button{margin-top:12px;width:100%;background:var(--acc);color:#1a1206;border:0;border-radius:10px;font:600 15px Archivo,sans-serif;padding:13px;min-height:46px;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#err{color:#ff9a8a;font-size:14px;min-height:1.5em;margin-top:10px}
</style>
</head>
<body>
<main class="room">
  <div class="box" aria-hidden="true"></div>
  <h1>Elverket Rum</h1>
  <p>Immersiva miljöer för Vidi Immersive. Ange lösenordet du fått för att gå in i rummet.</p>
  <form id="f">
    <label for="pw">Lösenord</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Gå in</button>
    <div id="err" role="alert"></div>
  </form>
</main>
<script>
{
  const f = document.getElementById('f'), err = document.getElementById('err');
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    const r = await fetch('/api/login', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({password: document.getElementById('pw').value})}).catch(() => null);
    if (!r || !r.ok) { err.textContent = r && r.status === 401 ? 'Fel lösenord.' : 'Kunde inte logga in just nu.'; return; }
    const next = new URLSearchParams(location.search).get('next') || '/';
    location.href = next.startsWith('/') && !next.startsWith('//') ? next : '/';
  });
}
</script>
</body>
</html>
